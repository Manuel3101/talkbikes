<button
  #trigger
  type="button"
  aria-haspopup="menu"
  [attr.aria-expanded]="isOpen()"
  [disabled]="disabled()"
  (click)="toggle()"
  class="flex items-center gap-2 rounded-lg border border-white/10 bg-[#17171b] px-3 py-1.5 text-xs text-zinc-300 transition-colors hover:bg-white/5 focus-visible:ring-2 focus-visible:ring-indigo-300 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-40"
>
  <span class="text-zinc-500">Anbieter</span>
  <span class="font-medium text-zinc-100">{{ selectedLabel() }}</span>
  <svg
    aria-hidden="true"
    class="size-3.5 text-zinc-500 transition-transform"
    [class.rotate-180]="isOpen()"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2"
  >
    <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
  </svg>
</button>

@if (isOpen()) {
<div
  role="menu"
  aria-label="KI-Anbieter auswählen"
  class="absolute right-0 z-20 mt-2 w-72 overflow-hidden rounded-xl border border-white/10 bg-[#17171b] p-1 shadow-xl shadow-black/40"
>
  @for (provider of providers(); track provider.id) {
  <button
    type="button"
    role="menuitemradio"
    [attr.aria-checked]="provider.id === selected()"
    (click)="select(provider)"
    class="flex w-full items-start gap-2 rounded-lg px-3 py-2 text-left transition-colors hover:bg-white/5 focus-visible:bg-white/5 focus-visible:outline-none"
  >
    <span class="mt-0.5 size-4 shrink-0 text-indigo-300">
      @if (provider.id === selected()) {
      <svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7" />
      </svg>
      }
    </span>
    <span class="flex flex-col gap-0.5">
      <span class="text-sm font-medium text-zinc-100">{{ provider.label }}</span>
      <span class="text-xs text-zinc-500">{{ provider.description }}</span>
    </span>
  </button>
  }
</div>
}
