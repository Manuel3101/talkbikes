<main class="flex min-h-screen flex-col bg-[#09090b] text-zinc-100">
  <header class="border-b border-white/10 bg-[#09090b]/95 px-4 py-4 backdrop-blur sm:px-6">
    <div class="mx-auto flex w-full max-w-5xl items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="flex size-9 items-center justify-center rounded-xl bg-indigo-500/15 text-indigo-300 ring-1 ring-indigo-400/20">
          <svg aria-hidden="true" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5m7-2a8 8 0 0 1-8 8 8.5 8.5 0 0 1-3.6-.8L4 20l.8-3.4A8 8 0 1 1 20 12Z" />
          </svg>
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-tight text-white">Chatwithgbfs</h1>
          <p class="text-xs text-zinc-500">Dein Nahverkehr Assistent</p>
        </div>
      </div>
    </div>
  </header>

  <section aria-labelledby="conversation-title" class="mx-auto flex min-h-0 w-full max-w-5xl flex-1 flex-col px-3 py-4 sm:px-6 sm:py-6">
    <div class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-2xl border border-white/10 bg-[#111114] shadow-2xl shadow-black/20">
      <div class="flex items-center justify-between border-b border-white/10 px-4 py-3 sm:px-6">
        <div>
          <h2 id="conversation-title" class="text-sm font-medium text-zinc-100">Neuer Chat</h2>
          <p class="mt-0.5 text-xs text-zinc-500">Stelle Fragen über alles mögliche zur Mobilität</p>
        </div>
      </div>

      <div hlmMessageScrollerProvider [autoScroll]="true" class="min-h-0 flex-1">
        <div hlmMessageScroller class="h-full">
          <div hlmMessageScrollerViewport aria-label="Chat messages">
            <div hlmMessageScrollerContent class="mx-auto w-full max-w-3xl gap-8 p-4 sm:p-8">
                @for (message of messages(); track message.id) {
                    @if (message.role == 'system') {
                        <div hlmMessageScrollerItem messageId="@message.id" [scrollAnchor]="false" class="flex gap-3">
                            <app-system-message [message]="message" />
                        </div>
                    } @else {
                        <div hlmMessageScrollerItem messageId="@message.id" [scrollAnchor]="true" class="flex justify-end gap-3">
                            <app-user-message [message]="message" />
                        </div>
                    }
                }
            </div>
          </div>
          <button hlmMessageScrollerButton></button>
        </div>
      </div>

      <footer class="border-t border-white/10 bg-[#0d0d10] p-3 sm:p-4">
        <form class="mx-auto flex w-full max-w-3xl items-end gap-2 rounded-xl border border-white/10 bg-[#17171b] p-2 shadow-inner shadow-black/20" (submit)="$event.preventDefault()">
          <label class="sr-only" for="chat-message">Stelle eine Frage an den GBFS Assistenten</label>
          <textarea
            id="chat-message"
            rows="1"
            placeholder="Stelle eine Frage an den GBFS Assistenten"
            class="max-h-32 min-h-10 flex-1 resize-none bg-transparent px-2 py-2 text-sm text-zinc-200 outline-none placeholder:text-zinc-600"
          ></textarea>
          <button
            type="submit"
            aria-label="Nachricht senden"
            class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-indigo-500 text-white transition-colors hover:bg-indigo-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300 disabled:cursor-not-allowed disabled:opacity-40"
          >
            <svg aria-hidden="true" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m5 12 14-7-7 14-2-6-5-1Zm7 0h7" />
            </svg>
          </button>
        </form>
        <p class="mt-2 text-center text-[11px] text-zinc-600">KI generierte Nachrichten können fehlerhaft sein.</p>
      </footer>
    </div>
  </section>
</main>

<router-outlet />
