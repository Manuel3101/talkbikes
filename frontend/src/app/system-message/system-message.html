<div class="flex w-full gap-3">
  <div class="max-w-2xl min-w-0 flex-1 space-y-2">
    <p class="text-xs font-medium text-indigo-300">Talkbikes</p>
    <p
      class="rounded-2xl rounded-tl-sm bg-white/[0.06] px-4 py-3 text-sm leading-6 text-zinc-300 ring-1 ring-white/[0.06]"
    >
      {{ message().content }}
    </p>
    @defer (when mapData().length > 0) {
    <app-bike-map [locations]="mapData()" />
    } @error {
    <p class="rounded-xl bg-red-500/10 px-3 py-2 text-sm text-red-200">Die Karte konnte nicht geladen werden.</p>
    }
  </div>
</div>
