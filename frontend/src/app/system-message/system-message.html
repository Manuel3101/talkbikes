<div class="flex w-full gap-3">
  <div
    class="mt-1 flex size-8 shrink-0 items-center justify-center rounded-lg bg-indigo-500/15 text-indigo-300 ring-1 ring-indigo-400/20"
  >
    <svg aria-hidden="true" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 3v2m6.4.6-1.4 1.4M21 12h-2M18.4 18.4 17 17M12 21v-2m-6.4-.6L7 17M3 12h2m.6-6.4L7 7m5 1.5a3.5 3.5 0 1 1 0 7Z"
      />
    </svg>
  </div>
  <div class="max-w-2xl min-w-0 flex-1 space-y-2">
    <p class="text-xs font-medium text-indigo-300">Talkbikes</p>
    <p
      class="rounded-2xl rounded-tl-sm bg-white/[0.06] px-4 py-3 text-sm leading-6 text-zinc-300 ring-1 ring-white/[0.06]"
    >
      {{ message().content }}
    </p>
    @defer (when mapData().length > 0) {
    <app-bike-map [toolData]="mapData()" />
    } @error {
    <p class="rounded-xl bg-red-500/10 px-3 py-2 text-sm text-red-200">Die Karte konnte nicht geladen werden.</p>
    }
  </div>
</div>
